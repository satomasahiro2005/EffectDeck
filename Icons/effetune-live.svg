<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- EffeTune Live
       EffeTune のアイコン（光るリング＋プラス）に、左右へ抜ける直線を足したもの。
       音が途中を通っていくことを出したい。 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#131c30"/>
      <stop offset="55%"  stop-color="#080d18"/>
      <stop offset="100%" stop-color="#03050b"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- リングの内側のほのかな明かり -->
  <circle cx="512" cy="512" r="300" fill="#2f9fe0" opacity="0.13" filter="url(#glow)"/>

  <!-- 左右へ抜ける線。ここが EffeTune 本体との違い -->
  <g stroke="#6fd2ff" stroke-width="26" stroke-linecap="round">
    <g filter="url(#glow)" opacity="0.85">
      <path d="M 40 512 H 250"/>
      <path d="M 774 512 H 984"/>
    </g>
    <path d="M 40 512 H 250"/>
    <path d="M 774 512 H 984"/>
  </g>
  <g stroke="#eaf8ff" stroke-width="9" stroke-linecap="round">
    <path d="M 40 512 H 250"/>
    <path d="M 774 512 H 984"/>
  </g>

  <!-- 外側の目盛りリング -->
  <circle cx="512" cy="512" r="368" fill="none" stroke="#4aa8dd" stroke-width="16"
          stroke-dasharray="5 22" opacity="0.5" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="340" fill="none" stroke="#4aa8dd" stroke-width="4"
          stroke-dasharray="3 16" opacity="0.4"/>

  <!-- 本体のリング -->
  <g fill="none" stroke-linecap="round">
    <circle cx="512" cy="512" r="262" stroke="#5ec8ff" stroke-width="30"
            filter="url(#glow)" opacity="0.9"/>
    <circle cx="512" cy="512" r="262" stroke="#8ddcff" stroke-width="20"/>
    <circle cx="512" cy="512" r="262" stroke="#f2fbff" stroke-width="7"/>
  </g>

  <!-- プラス -->
  <g stroke-linecap="round">
    <g stroke="#5ec8ff" stroke-width="58" filter="url(#glow)" opacity="0.95">
      <path d="M 512 372 V 652"/>
      <path d="M 372 512 H 652"/>
    </g>
    <g stroke="#9ce2ff" stroke-width="44">
      <path d="M 512 372 V 652"/>
      <path d="M 372 512 H 652"/>
    </g>
    <g stroke="#ffffff" stroke-width="17">
      <path d="M 512 372 V 652"/>
      <path d="M 372 512 H 652"/>
    </g>
  </g>
</svg>
