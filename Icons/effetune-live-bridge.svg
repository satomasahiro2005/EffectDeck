<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- EffeTune Live Bridge
       拡張を運ぶだけのアプリ。開く必要が無いので、本体より沈めてある。
       中身は同じリングだが、光らせず輪郭だけ。左右の線は繋がっている（通り道）。 -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%"   stop-color="#101622"/>
      <stop offset="55%"  stop-color="#070a11"/>
      <stop offset="100%" stop-color="#030407"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 端から端まで抜ける線。ここは素通し -->
  <g stroke="#4c6478" stroke-width="22" stroke-linecap="round">
    <g filter="url(#glow)" opacity="0.6">
      <path d="M 40 512 H 984"/>
    </g>
    <path d="M 40 512 H 984"/>
  </g>

  <!-- 外側の目盛りリング -->
  <circle cx="512" cy="512" r="340" fill="none" stroke="#3d5468" stroke-width="4"
          stroke-dasharray="3 16" opacity="0.55"/>

  <!-- リング。光らせない -->
  <circle cx="512" cy="512" r="262" fill="#070a11"/>
  <g fill="none">
    <circle cx="512" cy="512" r="262" stroke="#66839b" stroke-width="20"/>
    <circle cx="512" cy="512" r="262" stroke="#9fb6c8" stroke-width="6"/>
  </g>

  <!-- プラス。輪郭だけ -->
  <g stroke-linecap="round" fill="none">
    <g stroke="#66839b" stroke-width="44">
      <path d="M 512 372 V 652"/>
      <path d="M 372 512 H 652"/>
    </g>
    <g stroke="#b9cbd9" stroke-width="15">
      <path d="M 512 372 V 652"/>
      <path d="M 372 512 H 652"/>
    </g>
  </g>
</svg>
